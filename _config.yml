# Site settings
title: Your Awesome Site Title
email: your-email@example.com
description: >-
  Write a short description of your website here.
  It appears in search engine results and feeds.

# Theme & Appearance
# theme: jekyll-theme-minimal
# Or use a remote theme like:
# remote_theme: cotes2020/jekyll-theme-chirpy
remote_theme: pages-themes/tactile@v0.2.0

# Base URL & Domain
baseurl: "" # The subpath of your site, e.g. /blog
url: "https://yourusername.github.io" # Your site's domain

# Social Links & Author
author:
  name: Your Name
  twitter: yourhandle
  github: yourusername

# Build Settings
markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-remote-theme
